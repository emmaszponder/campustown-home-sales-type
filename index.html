<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Campus Communities</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #f5f7fa;
    color: #333;
    line-height: 1.6;
}

header {
    background: linear-gradient(135deg, #13294B, #1e4d8f);
    color: white;
    text-align: center;
    padding: 4rem 2rem;
}

header h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
}

header p {
    max-width: 700px;
    margin: auto;
    font-size: 1.1rem;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 2rem;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h2 {
    color: #13294B;
    margin-bottom: 1rem;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 1rem;
    margin-top: 1rem;
}

.stat {
    background-color: #eef4ff;
    border-radius: 10px;
    padding: 1.5rem;
    text-align: center;
}

.stat h3 {
    color: #13294B;
    font-size: 2rem;
}

.highlight {
    background: #fff8e7;
    border-left: 5px solid #f4b400;
}

ul {
    padding-left: 1.5rem;
}
</footer>

</body>

</html>
